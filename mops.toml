[package]
name = "slot-machine"
version = "0.1.0"
description = "A provably fair on-chain slot machine MCP server"
repository = "https://github.com/jneums/slot-machine"
keywords = ["slots", "gambling", "provably-fair", "mcp"]
license = "MIT"

[dependencies]
base = "0.16.0"
json = "1.4.0"
map = "9.0.1"
http-types = "1.0.1"
base-x-encoder = "2.1.0"
jwt = "2.1.0"
ecdsa = "7.1.0"
certified-cache = "0.3.0"
sha2 = "0.1.6"
ic = "3.2.0"
mcp-motoko-sdk = "2.0.2"

[dev-dependencies]
test = "2.1.1"

[toolchain]
moc = "0.16.0"
