  why_this_app: A fully on-chain slot machine where every spin is provably fair. ICP's raw_rand() provides cryptographic randomness with no external oracles — just spin, verify, and trust the math. A progressive jackpot pool grows with every bet, and a competitive leaderboard tracks the biggest wins across all players.
  key_features:
    - Provably fair — every spin uses ICP raw_rand() subnet threshold BLS randomness
    - Progressive jackpot — a portion of each bet feeds the pool, and three 🎰s win it all
    - Competitive leaderboard — biggest wins, most spins, highest balance, most wagered
    - Free credit faucet — claim credits every 4 hours, no wallet required
    - Full transparency — symbol frequency distribution, actual house edge, and payout table are all public
    - Fairness verification — replay any spin's outcome from its stored seed
    - On-chain everything — balances, history, stats, and randomness all live in canister state
