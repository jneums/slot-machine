  why_this_app: The first provably fair on-chain slot machine with an MCP interface. Features a progressive jackpot pool, competitive leaderboard, near-miss dopamine, and a fair 9.5% house edge. Every spin uses ICP raw_rand() for cryptographic randomness — no external oracles, no trust required.
  key_features:
    - Provably fair — every spin uses ICP raw_rand() subnet threshold BLS randomness
    - Progressive jackpot — 2% of each bet feeds the pool, three 🎰s win it all
    - Competitive leaderboard — biggest wins, most spins, highest balance, most wagered
    - Near-miss messages — emotional feedback on close calls adds dopamine texture
    - Rebalanced 9.5% house edge — sessions last longer, feel more rewarding
    - Symbol frequency transparency — actual vs expected distribution from real spins
    - 4-hour faucet cooldown — more play sessions per day
    - V2-ready for ICRC token deposits
